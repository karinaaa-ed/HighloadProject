version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: review2
      POSTGRES_USER: review2
      POSTGRES_PASSWORD: review2
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: review2
      DB_USER: review2
      DB_PASSWORD: review2
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
