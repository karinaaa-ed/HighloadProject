version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: review2-db
    environment:
      POSTGRES_DB: review2
      POSTGRES_USER: review2
      POSTGRES_PASSWORD: review2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - review2-net

  backend:
    build: .
    container_name: review2-backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: review2
      DB_USER: review2
      DB_PASSWORD: review2
    volumes:
      - .:/app
    networks:
      - review2-net

  frontend:
    image: nginx:1.27-alpine
    container_name: review2-frontend
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - review2-net

networks:
  review2-net:
    driver: bridge

volumes:
  postgres_data:
